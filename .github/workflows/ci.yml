name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build clang linux-tools-generic pkg-config \
            libbpf-dev libglib2.0-dev libglib2.0-bin libjson-c-dev libsqlite3-dev libgtk-3-dev \
            libayatana-appindicator3-dev libnotify-dev libpolkit-gobject-1-dev libsystemd-dev \
            xvfb dbus-x11 at-spi2-core librsvg2-common x11-utils
          # Hosted runner kernels can be newer than Noble's matching tools package.
          bpftool_binary=$(find /usr/lib -maxdepth 3 -type f -name bpftool -perm -111 \
            -path '/usr/lib/linux-tools*' -print 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$bpftool_binary" ]; then
            echo '::error::linux-tools-generic did not provide a usable bpftool binary'
            dpkg -l 'linux-tools*' || true
            exit 1
          fi
          sudo install -m 0755 "$bpftool_binary" /usr/local/bin/bpftool
          bpftool version
      - name: Configure sanitized build
        run: meson setup build --buildtype=debug -Db_sanitize=address,undefined -Dintegration_tests=false -Ddesktop_ui=enabled
      - name: Compile
        run: meson compile -C build
      - name: Unit and protocol tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: meson test -C build --no-suite privileged --print-errorlogs
      - name: GTK interaction test
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          NO_AT_BRIDGE: 1
        run: dbus-run-session -- xvfb-run -a meson test -C build ui ui-activation --print-errorlogs
      - name: Release install contract
        run: |
          meson setup build-package --prefix=/opt/memspy --buildtype=release -Dintegration_tests=false -Ddesktop_ui=enabled
          meson compile -C build-package
          sh tests/package/test_install.sh build-package desktop
      - name: Headless build and install contract
        run: |
          meson setup build-headless --prefix=/opt/memspy --buildtype=release -Dintegration_tests=false -Ddesktop_ui=disabled
          meson compile -C build-headless
          meson test -C build-headless --no-suite privileged --print-errorlogs
          sh tests/package/test_install.sh build-headless headless
